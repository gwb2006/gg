spring.application.name=cjrh

# 数据库连接配置
# 注意：当前出现 "Access denied for user 'boot'@'localhost'" 错误，请检查：
# 1. MySQL服务是否已启动
# 2. 用户名'boot'和密码'123456'是否正确
# 3. 用户'boot'是否有访问'gg'数据库的权限
# 4. 数据库'gg'是否已创建
spring.datasource.url=jdbc:mysql://localhost:3306/gg?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect